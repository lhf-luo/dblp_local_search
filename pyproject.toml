[project]
name = "dblp-local-search"
version = "0.1.0"
description = "Read-only DBLP snapshot search service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "lxml>=5.3,<7", "filelock>=3.17,<4", "APScheduler>=3.11,<4", "tzdata>=2025.1"]

[project.scripts]
dblp-local = "dblp_local_search.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
